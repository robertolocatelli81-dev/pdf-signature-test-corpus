name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install V1 (pyHanko)
        run: pip install pyHanko==0.37.0 pyhanko-certvalidator==0.32.1
      - name: Fetch V2 jars (sha1 + pinned sha256)
        run: python tools/fetch_jars.py
      - name: SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: build.py without keys stops; SHA256SUMS regenerates identically
        run: |
          if python build.py --no-measure --out "$RUNNER_TEMP/rebuild"; then exit 1; fi
          python build.py --sums-only
          git diff --exit-code SHA256SUMS
      - name: Re-measure and compare with EXPECTED.json (with positive control)
        run: python check.py --positive-control
